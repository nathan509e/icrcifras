<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icons/icon-128.webp" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cifras" />
    <meta name="description" content="Cifras de louvor para a Igreja Caminho da Restauracao" />
    <title>Cifras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="app-loading-screen" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111111;z-index:999999;">
        <div style="width:44px;height:44px;border:4px solid rgba(251,177,52,0.18);border-top-color:#fbb134;border-radius:50%;animation:app-spin 0.75s linear infinite;box-shadow:0 0 16px rgba(251,177,52,0.25);"></div>
        <style>@keyframes app-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.add('dark');document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#000000')}var _ac=localStorage.getItem('accent-color');if(_ac){document.documentElement.style.setProperty('--accent-color',_ac)}</script>
    <script>window.addEventListener('error',function(e){console.error('Global error:',e.error||e.message)})</script>
    <script>window.addEventListener('unhandledrejection',function(e){console.error('Unhandled rejection:',e.reason)})</script>
  <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
