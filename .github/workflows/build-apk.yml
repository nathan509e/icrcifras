name: Build Android Release Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          fi

      - name: Restrict keystore permissions
        shell: bash
        run: |
          if [ -f android/release.keystore ]; then
            chmod 600 android/release.keystore
          fi

      - name: Validate release keystore alias
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -f android/release.keystore ]; then
            if ! keytool -list -keystore android/release.keystore -storepass "$KEYSTORE_PASSWORD" | grep -q "$KEY_ALIAS"; then
              echo "Configured ANDROID_KEY_ALIAS does not exist in android/release.keystore"
              exit 1
            fi
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Capacitor Java version
        run: node scripts/patch-capacitor-java.mjs

      - name: Build release bundle and apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cifras-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload release apk
        uses: actions/upload-artifact@v4
        with:
          name: cifras-release-apk
          path: android/app/build/outputs/apk/release/*.apk
